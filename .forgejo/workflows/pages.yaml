name: Deploy to cm-tracks.flipdot.org

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/git-pages@v2
        with:
          site: https://cm-tracks.flipdot.org/
          server: cm-tracks.flipdot.org
          password: ${{ secrets.SITE_PASSWORD }}
          source: dist
          strict: true
          comment: ${{ forgejo.sha }}
